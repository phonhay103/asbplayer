# Supply-chain lag: only install versions published more than 7 days ago
# (pnpm counts minutes), so a malicious or broken publish is yanked before
# we can pick it up.
minimumReleaseAge: 10080

packages:
    - 'client'
    - 'common'
    - 'extension'
    - 'docs'
    - 'scripts/loc'

catalog:
    typescript: ^5.8.3

patchedDependencies:
    'lamejs@1.2.0': patches/lamejs-npm-1.2.0-b0315d05aa.patch

allowBuilds:
    core-js: true
    core-js-pure: true
    esbuild: true
    unrs-resolver: true
